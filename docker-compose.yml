services:
  steamfarm:
    image: ghcr.io/mayberts/steamfarm:latest
    # To build locally instead of pulling, run: docker compose up -d --build
    build: .
    container_name: steamfarm
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Password for the web UI. If empty, one is generated and printed in `docker compose logs`.
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      # Set to "true" if you serve the UI over HTTPS through a reverse proxy.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-UTC}
    volumes:
      - steamfarm-data:/data

volumes:
  steamfarm-data:
